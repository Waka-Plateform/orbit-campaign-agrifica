name: Deploy campaign backend
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
env:
  LOCATION: francecentral
  RESOURCE_GROUP: rg-orbit-campaign-agrifica
  CONTAINER_APP: orbit-campaign-agrifica
  ACR_NAME: crorbitplatform
  CAE_NAME: cae-orbit-platform
  IMAGE_NAME: orbit-campaign-agrifica
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Azure login OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build and push image
        run: |
          az acr login --name $ACR_NAME
          IMAGE="$ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
      - name: Provision infrastructure
        run: |
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters location="$LOCATION" containerAppName="$CONTAINER_APP" containerAppsEnvironmentName="$CAE_NAME" acrName="$ACR_NAME" imageTag="${{ github.sha }}"
      - name: Update Container App image
        run: |
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}"
          az containerapp ingress enable \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --type external \
            --target-port 8000
